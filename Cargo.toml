[package]
name = "image-janitor"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
env_logger = { version = "0.11", default-features = false }
lazy_static = "1.5"
log = "0.4"
regex = "1"
thiserror = "2.0"
glob = "0.3"
path-clean = "1.0.1"
rayon = "1.10"

[target.'cfg(not(windows))'.dev-dependencies]
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls", "rustls-webpki-roots"] }
indicatif = { version = "0.18", default-features = false, features = ["rayon"] }

[[bench]]
name = "parallelism"
harness = false
